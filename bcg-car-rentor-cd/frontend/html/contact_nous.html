<body>
  <div>
    <header>
      <!-- ***** Nav bar ***** -->
      <div id="navbar_container"></div>

    <!-- ***** main section (text,button,image) ***** -->
    <section>

      <div class="map-container">
        <iframe class="map-iframe"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d53157.075486762!2d-8.0769722!3d31.6411667!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzHCsDM4JzI4LjIiTiA4wrAwNCczNy4xIlc!5e0!3m2!1sen!2sma!4v1745396541480!5m2!1sen!2sma"

      </div>

      <div class="contact-container">
        <div class="contact-form">
          <h2>Contacter nous</h2>
          <form>
            <div class="form-group1">

            </div>
            <div class="form-group">
              <input type="tel" placeholder="Numéro de téléphone" required />
              <input type="email" placeholder="example@gmail.com" required />
            </div>
            <textarea placeholder="Votre message ici ..." required></textarea>
            <button type="submit" class="envoyer">Envoyer</button>
          </form>
        </div>

        <div class="contact-info">
          <h2 class="card-title">Contact Us Here !</h2>
          <div class="card-content">
            <div class="info">
              <a href="mailto:bcgcarrental@business.com" target="_blank">
                <i class="fa-solid fa-envelope"></i>
                <span>bcgcarrental@business.com</span>
              </a>
            </div>
            <div class="info">
              <a href="tel:+212500255526" target="_blank">
                <i class="fa-solid fa-phone"></i>
                <span>0500255526</span>
              </a>
            </div>
            <div class="info">
              <a href="http://wa.me/0615222666" target="_blank">
                <i class="fa-solid fa-mobile-screen"></i>
                <span>0615222666</span>
              </a>
            </div>
            <div class="info">
              <a href="http://wa.me/0615222666" target="_blank">
                <i class="fa-brands fa-whatsapp"></i>

            </div>
            <div class="info">
              <i class="fa-solid fa-location-dot"></i>
              <span>Derb sultan, Rue N06, Marrakech</span>
            </div>
          </div>

      </div>
