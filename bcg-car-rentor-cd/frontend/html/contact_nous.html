<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contactez nous</title>
    <link rel="stylesheet" href="../css/page_accueil/nav_bar.css" />
    <link rel="stylesheet" href="../css/contact_nous/contact_nous.css" />
    <!-- Google icons  -->
    <link
      href="https://fonts.googleapis.com/css?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Two+Tone|Material+Icons+Round|Material+Icons+Sharp"
      rel="stylesheet"
    />
    <!-- font icons  -->
    <link rel="stylesheet" href="/frontend/fontawesome-free-6.7.2-web/css/all.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div>
      <header>
        <!-- ***** Nav bar ***** -->
        <div id="navbar_container"></div>
      </header>

      <!-- ***** main section (text,button,image) ***** -->
      <section>
        <div class="contact-container">
          <div class="contact-form">
            <h2>Contacter nous</h2>
            <form>
              <div class="form-group">
                <input type="text" placeholder="Votre prénom ..." required />
                <input type="text" placeholder="Votre nom ..." required />
              </div>
              <div class="form-group">
                <input type="tel" placeholder="06 12 34 56 78 ..." required />
                <input
                  type="email"
                  placeholder="example@gmail.com ..."
                  required
                />
              </div>
              <textarea placeholder="Votre message ici ..." required></textarea>
              <button type="submit">Envoyer</button>
            </form>
          </div>

          <div class="contact-info">
            <div class="contacts-info">
              <div class="info">
                <i class="fa-solid fa-envelope"></i>
                <span>bcgcarrental@business.com</span>
              </div>
              <div class="info">
                <i class="fa-solid fa-phone"></i>
                <span>0500255526</span>
              </div>
              <div class="info">
                <i class="fa-solid fa-mobile-screen"></i>
                <span>0615222666</span>
              </div>
              <div class="info">
                <i class="fa-brands fa-whatsapp"></i>
                <span>0615222666</span>
              </div>
              <div class="info">
                <i class="fa-solid fa-location-dot"></i>
                <span>Derb sultan, Rue N06, Marrakech</span>
              </div>
            </div>
          </div>
          
        </div>
      </section>
    </div>
  </body>
  <script src="../js/nav_bar.js"></script>
</html>
