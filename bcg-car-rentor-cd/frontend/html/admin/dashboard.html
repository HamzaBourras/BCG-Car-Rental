<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin dashboard</title>
  <link rel="stylesheet" href="../../css/Dashboard/dashboard.css">
	<script src="https://kit.fontawesome.com/1381de1bb1.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="dashboard-container">

		<div class="sidebar">
			<div class="logo">
				<img src="../../images/logo2.png" class="logo-img" alt="">
				<span>Panneau d'administration</span>
			</div>
			<nav class="nav-menu">
				<ul>
					<li><a href="#"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
					<li><a href="#"><i class="fa-solid fa-car"></i> Voitures</a></li>
					<li><a href="#"><i class="fa-solid fa-table-list"></i> Réservations</a></li>
					<li><a href="#"><i class="fa-solid fa-users-line"></i> Clients</a></li>
				</ul>
			</nav>
			<div class="user-profile">
				<a href="#">
					<i class="fa-solid fa-user"></i>
					<span>Profil</span>
				</a>
				<a href="#">
					<i class="fa-solid fa-gear"></i>
					<span>Paramètres</span>
				</a>
			</div>
		</div>
		<div class="main">
			<h1>Bienvenue dans le tableau de bord</h1>
			<header class="dashboard-header">
				<div class="search-container">
					<i class="fas fa-search"></i>
					<input type="text" placeholder="Rechercher...">
				</div>
				<div class="header-right">
					<div class="notification">
						<i class="fa-solid fa-bell"></i>
					</div>
					<div class="message">
						<i class="fa-solid fa-message"></i>
					</div>
					<div class="profil">
						<i class="fa-solid fa-user"></i>
						<i class="fas fa-chevron-down"></i>
					</div>
				</div>
			</header>

			<div class="dashboard-content">

			</div>

		</div>
		
  </div>
</body>
</html>
