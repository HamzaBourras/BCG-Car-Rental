<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reservations</title>
	<link rel="stylesheet" href="../../css/admin/reservations.css">
	<link rel="stylesheet" href="../../css/admin/sidebar_header.css">
	<link rel="stylesheet" href="../../fontawesome-free-6.7.2-web/css/all.css" />
	<link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
		rel="stylesheet">
</head>

<body>
	<div class="container">


		<!-- div sidebar -->
		<div class="sidebar" id="side">

		</div>
		<div class="main">

			<!-- div pour header -->
			<header class="header" id="header">

			</header>

			<div class="content">
				<h2>Gestion des réservations</h2>
				<div class="table-container">
					<table class="data-table">
						<thead>
							<tr>
								<th>ID</th>
								<th>ID Client</th>
								<th>ID Voiture</th>
								<th>Date de départ</th>
								<th>Date de retour</th>
								<th>Montant</th>
								<th>Statut de paiment</th>
								<th>Action</th>
							</tr>
						</thead>
						
						<tbody>
        			<tr data-id="1001">
          		<td>1001</td>
          		<td>12344</td>
          		<td>3322</td>
          		<td>8/1/2025</td>
          		<td>20/1/2025</td>
          		<td>400dh</td>
          		<td>Pending</td>
          		<td class="action-buttons">
            		<button class="confirm-btn" onclick="confirmReservation('1001')">Confirmer</button>
            		<button class="delete-btn" onclick="deleteReservation('1001')">Annuler</button>
          		</td>
        		</tr>

					</table>
				</div>
			</div>

		</div>

	</div>
	<script src="/frontend//js/routes_config.js"></script>
	<script src="../../js/admin/sidebar_header.js"></script>
</body>

</html>
