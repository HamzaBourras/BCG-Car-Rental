<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>voitures</title>
    <link rel="stylesheet" href="../../css/admin/voitures.css">
    <link rel="stylesheet" href="../../fontawesome-free-6.7.2-web/css/all.css" />
    <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- style du div du message -->
    <style>
        #glob {
            display: none;
            width: 100%;
            height: 100vh;
            position: absolute;
            left: 0%;
            top: 0%;
            background-color: rgba(58, 58, 58, 0.811);
            justify-content: center;
            align-items: center;
        }

        #glob #content {
            position: relative;
            width: 50%;
            height: max-content;
            min-height: 100px;
            background-color: rgba(255, 255, 255, 0.908);
            border-radius: 15px;
            padding: 10px 20px;
        }

        #glob #content #message {
            font-size: 26px;
            text-transform: uppercase;
            color: black;
        }

        #glob #content #btn {
            text-align: end;
        }

        #glob #content #btn button {
            border-radius: 8px;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            list-style: none;
            margin: 10px;
            outline: none;
            padding: 8px 16px;
            position: relative;
            text-align: center;
            text-decoration: none;
            vertical-align: baseline;
            touch-action: manipulation;
        }

        #glob #content #errors {
            padding: 5px 10%;
        }

        #glob #content #errors li {
            margin: 4px 0;
            color: #ff1919;
            font-size: 16px;
            font-weight: 500;
        }

        .danger {
            border: 2px solid #c71414;
            color: #c71414;
        }

        .danger:hover {
            color: #FFFFFF;
            background-color: #c71414;
            transition: 400ms;
        }

        .success {
            border: 2px solid #0b7840;
            color: #0b7840;
        }

        .success:hover {
            color: #FFFFFF;
            background-color: #0b7840;
            transition: 400ms;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="sidebar">

        </div>
        <div class="">
            <header></header>
            <div>
                <div id="ajouter"><button onclick="ajouterVoiture()"> <i class="fa fa-plus"></i> Ajouter</button></div>
                <main class="main-content" id="main-content">

                </main>
            </div>
        </div>
    </div>

    <!-- div pour le message -->
    <div id="glob">
        <div id="content">
            <h2 id="message">message</h2>
            <ul id="errors">
            </ul>
            <div id="btn">
                <button>event</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="../../js/admin/voitures.js"></script>
    <script type="module" src="../../js/page_accueil/get_voitures.js"></script>
</body>

</html>
