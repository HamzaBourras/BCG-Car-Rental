<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voitures</title>
  <link rel="stylesheet" href="../css/page_accueil/nav_bar.css" />
  <link rel="stylesheet" href="../css/page_voitures/page_voitures.css" />
  <link rel="stylesheet" href="../css/page_accueil/best-deals.css">
  <link rel="stylesheet" href="../css/page_accueil/footer.css">
  <link rel="stylesheet" href="/frontend/fontawesome-free-6.7.2-web/css/all.css" />
  <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
</head>

<body>
  <header>
    <!-- ***** Nav bar ***** -->
    <div id="navbar_container"></div>
  </header>

  <!-- ***** section des voitures ***** -->
  <!-- #### il est liée au fichier css best-deals de la page d'accueil -->
  <main>
    <div class="best-deals" style="background: none;">
      <!-- ** section des inputs des filtres ** -->
      <section class="filters">
        <h2 class="find-car">TROUVEZ VOTRE VOITURE</h2>
        <div class="filter-bar">
          <select name="marque" id="marque" class="filter-input">
          </select>

          <input type="number" class="filter-input" placeholder="Min prix" id="prix_min" min="0">
          <input type="number" class="filter-input" placeholder="Max prix" id="prix_max" min="0">

          <!-- <button class="filter-btn" id="search-btn">chercher</button> -->
          <button class="filter-btn" id="reset-btn">Rséinitialiser</button>
        </div>

      </section>
      <!-- ** section des voitures ** -->
      <section class="cars-cards">

      </section>
    </div>
  </main>

  <!-- ***** Footer ***** -->
  <footer>
    <div class="footer-container" id="footer-container">
    </div>
  </footer>
</body>

<script src="/frontend/js/routes_config.js"></script>
<script src="../js/nav_bar.js"></script>
<script src="../js/footer.js"></script>
<script type="module" src="../js/page_accueil/get_voitures.js"></script>
<script type="module" src="../js/page_voitures/display_voitures.js"></script>

</html>
