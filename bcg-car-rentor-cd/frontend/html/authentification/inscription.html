<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/authentification/inscription.css">
    <title>Document</title>
</head>
<body>
    <div class="ClassForm">
        <div class="Text">
            <h2>S'inscrire</h2>
            <p>Créer votre compte</p>
        </div>
        <form action="traitement.php" method="post">
            <div class="form-row ">
                <label for="nom" >Nom</label>
                <input type="text" id="nom" required><br>
                <label for="prenom" >Prénom</label>
                <input type="text" id="prenom" required><br>
                <label for="email" >Email</label>
                <input type="email" id="email" required><br>
                <label for="telephone" >Telephone</label>
                <input pattern="[0-9]{10}" type="tel" id="telephone" required><br>
            </div>  
            <div class="form-row "> 
                <label for="adresse" >Adresse</label>
                <input type="text" id="adresse" required><br>
                <label for="password" >Password</label>
                <input minlength="6" type="password" id="password" required placeholder="Min. 6 caractères"><br>
                <label for="motpasseverif" >Confirme</label>
                <input type="password" id="motpasseverif" required><br>
            </div>
            <input type="submit" value="S'inscrire" id="envoyer">
        </form>
    </div>
    <script src="../../js/authentification/verifer_password.js"></script>
</body>
</html>
