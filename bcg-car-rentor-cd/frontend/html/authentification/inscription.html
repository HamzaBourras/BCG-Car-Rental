<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="../../css/authentification/inscription.css">
    <link rel="stylesheet" href="../../css/bloc_message.css">
    <link rel="stylesheet" href="/frontend/fontawesome-free-6.7.2-web/css/all.css" />
    <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="form-container">
            <div id="retour">
                <a href="../page_accueil.html"> <i class="fa-solid fa-arrow-left"></i>Accueil </a>
            </div>
            <div class="form-header">
                <h1>S'inscrire</h1>
                <p>Créer votre compte</p>
            </div>
            <form action="#" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nom">Nom</label>
                        <input type="text" id="nom" name="nom" required>
                    </div>

                    <div class="form-group">
                        <label for="prenom">Prénom</label>
                        <input type="text" id="prenom" name="prenom" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="telephone">Téléphone</label>
                        <input type="tel" id="telephone" name="telephone" required>
                    </div>
                    <div class="form-group">
                        <label for="adresse">Adresse</label>
                        <input type="text" id="adresse" name="adresse" required>
                    </div>

                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="min 8 caractères" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirme Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>

                <div class="form-row">
                    <p id="lien-conn">Si vous avez déja un compte.<a
                            href="../../html/authentification/connexion.html">veuillez vous connecter</a></p>
                    <button type="submit" class="submit-btn">S'inscrire</button>
                </div>
            </form>
        </div>
    </div>

    <!-- div pour le message -->
    <div id="glob">
        <div id="content">
            <h2 id="message">message</h2>
            <ul id="errors">
            </ul>
            <div id="btn">
                <button>event</button>
            </div>
        </div>
    </div>

    <script src="/frontend//js/routes_config.js"></script>
    <script type="module" src="../../js/authentification/inscrire.js"></script>
    <script src="../../js/authentification/inscription2.js"></script>
</body>

</html>
