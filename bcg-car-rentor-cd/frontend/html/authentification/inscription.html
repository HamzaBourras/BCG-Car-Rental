<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="../../css/page_accueil/nav_bar.css">
    <link rel="stylesheet" href="../../css/authentification/inscription.css">
    <link rel="stylesheet" href="/frontend/fontawesome-free-6.7.2-web/css/all.css" />
    <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- style du div du message -->
    <style>
        #glob {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0%;
            top: 0%;
            background-color: rgba(58, 58, 58, 0.811);
            justify-content: center;
            align-items: center;
        }

        #glob #content {
            position: relative;
            width: 50%;
            height: max-content;
            min-height: 100px;
            background-color: rgba(255, 255, 255, 0.908);
            border-radius: 15px;
            padding: 10px 20px;
        }

        #glob #content #message {
            font-size: 26px;
            text-transform: uppercase;
            color: black;
        }

        #glob #content #btn {
            text-align: end;
        }

        #glob #content #btn button {
            border-radius: 8px;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            list-style: none;
            margin: 10px;
            outline: none;
            padding: 8px 16px;
            position: relative;
            text-align: center;
            text-decoration: none;
            vertical-align: baseline;
            touch-action: manipulation;
        }

        #glob #content #errors {
            padding: 5px 10%;
        }

        #glob #content #errors li {
            margin: 4px 0;
            color: #ff1919;
            font-size: 16px;
            font-weight: 500;
        }

        .danger {
            border: 2px solid #c71414;
            color: #c71414;
        }

        .danger:hover {
            color: #FFFFFF;
            background-color: #c71414;
            transition: 400ms;
        }

        .success {
            border: 2px solid #0b7840;
            color: #0b7840;
        }

        .success:hover {
            color: #FFFFFF;
            background-color: #0b7840;
            transition: 400ms;
        }
    </style>
</head>

<body>
    <header>
        <!-- ***** Nav bar ***** -->
        <div id="navbar_container"></div>
    </header>
    <div class="container">
        <div class="form-header">
            <h1>S'inscrire</h1>
            <p>Créer votre compte</p>
        </div>
        <div class="form-container">
            <form action="#" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nom">Nom</label>
                        <input type="text" id="nom" name="nom" required>
                    </div>

                    <div class="form-group">
                        <label for="prenom">Prénom</label>
                        <input type="text" id="prenom" name="prenom" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="telephone">Téléphone</label>
                        <input type="tel" id="telephone" name="telephone" required>
                    </div>
                    <div class="form-group">
                        <label for="adresse">Adresse</label>
                        <input type="text" id="adresse" name="adresse" required>
                    </div>

                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="min 8 caractères" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirme Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>

                <div class="form-row">
                    <p id="lien-conn">Si vous avez déja un compte.<a
                            href="../../html/authentification/connexion.html">veuillez se connecter</a></p>
                    <button type="submit" class="submit-btn">S'inscrire</button>
                </div>
            </form>
        </div>
    </div>

    <!-- div pour le message -->
    <div id="glob">
        <div id="content">
            <h2 id="message">message</h2>
            <ul id="errors">
            </ul>
            <div id="btn">
                <button>event</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- <script src="../../js/nav_bar.js"></script> -->
    <script type="module" src="../../js/authentification/inscrire.js"></script>
    <script src="../../js/authentification/inscription2.js"></script
</body>

</html>
