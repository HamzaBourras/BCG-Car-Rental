<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil</title>
    <link rel="stylesheet" href="../../css/authentification/profile.css">
    <link rel="stylesheet" href="../../css/admin/sidebar_header.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../fontawesome-free-6.7.2-web/css/all.css" />
    <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- div sidebar -->
        <div class="sidebar" id="side">
        </div>

        <div class="main">
            <!-- div pour header -->
            <header class="header" id="header">
            </header>

            <div class="content">
                <div class="profile">
                    <div class="profile-container">
                        <h1>Profil</h1>
                        <h2>Gérer votre compte</h2>

                        <!-- Section du haut - Image, nom et inputs nom/prénom -->
                        <div class="profile-top">
                            <div class="profile-top-left">
                                <div class="profile-image-container">
                                    <div class="profile-image" id="profile-image"
                                        onclick="document.getElementById('image-upload').click()">
                                        <i class="fa-solid fa-plus" id="upload-icon"></i>
                                    </div>
                                    <div class="image-upload-overlay"
                                        onclick="document.getElementById('image-upload').click()">
                                        <i class="fa-solid fa-camera"></i>
                                    </div>
                                    <input type="file" id="image-upload" accept="image/*">
                                </div>

                                <div class="user-info">
                                    <div class="user-name" id="display-name">John Doe</div>
                                    <div class="user-email" id="display-email">john.doe@example.com</div>
                                </div>
                            </div>

                            <div class="profile-top-right">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="nom">Nom</label>
                                        <input type="text" id="nom" class="form-control" placeholder="Votre nom">
                                    </div>
                                    <div class="form-group">
                                        <label for="prenom">Prénom</label>
                                        <input type="text" id="prenom" class="form-control" placeholder="Votre prénom">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Section du bas - Formulaire complet -->
                        <div class="profile-bottom">
                            <div class="form-section">
                                <div class="form-section-title">Contact</div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="email">Email</label>
                                        <input type="email" id="email" class="form-control"
                                            placeholder="votre.email@example.com">
                                    </div>
                                    <div class="form-group">
                                        <label for="telephone">Téléphone</label>
                                        <input type="tel" id="telephone" class="form-control"
                                            placeholder="+212 6XX XX XX XX">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group full-width">
                                        <label for="adresse">Adresse</label>
                                        <input type="text" id="adresse" class="form-control"
                                            placeholder="Votre adresse complète">
                                    </div>
                                </div>
                            </div>

                            <div class="form-section">
                                <div class="form-section-title">Sécurité</div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="password">Nouveau mot de passe</label>
                                        <input type="password" id="password" class="form-control"
                                            placeholder="••••••••">
                                    </div>
                                    <div class="form-group">
                                        <label for="confirm-password">Confirmer le mot de passe</label>
                                        <input type="password" id="confirm-password" class="form-control"
                                            placeholder="••••••••">
                                    </div>
                                </div>
                            </div>

                            <div class="buttons">
                                <button type="button" class="btn btn-cancel" id="annuler">Annuler</button>
                                <button type="button" class="btn btn-save" id="enregistrer">Enregistrer</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../../js/authentification/profile.js"></script>
    <script src="/frontend/js/routes_config.js"></script>
    <script src="../../js/client/sidebar_header.js"></script>
</body>

</html>
