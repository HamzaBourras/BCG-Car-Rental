<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commentaires</title>
    <link rel="stylesheet" href="../../css/client/commentaires.css">
    <link rel="stylesheet" href="../../css/admin/sidebar_header.css">
    <link rel="stylesheet" href="../../fontawesome-free-6.7.2-web/css/all.css" />
    <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">


        <!-- div sidebar -->
        <div class="sidebar" id="side">

        </div>
        <div class="main">

            <!-- div pour header -->
            <header class="header" id="header">

            </header>

            <div class="content">
                <div class="comments">
                    <h1>Gestion des commentaires</h1>
                    <div class="comments-cards">

                    </div>
                </div>
            </div>

        </div>

    </div>
    
    <!-- Modale de modification -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h2>Modifier le commentaire</h2>
    <form id="editCommentForm">
      <textarea id="editCommentText" rows="5" required></textarea>
      <div class="modal-buttons">
        <button type="button" id="cancelEdit">Annuler</button>
        <button type="submit" id="saveEdit">Enregistrer</button>
      </div>
    </form>
  </div>
</div>
    <script src="/frontend//js/routes_config.js"></script>
    <script src="../../js/client/sidebar_header.js"></script>
    <script type="module" src="../../js/client/commentaires.js"></script>
</body>
</html>
